# Action to publish a new version of the package to NuGet

name: Publish

permissions:
  contents: read

on:
  release:
    types: [released]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # enable GitHub OIDC token issuance for this job
    
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.x
      - name: Restore dependencies
        run: dotnet restore RTSP.sln
      - name: Build
        run: dotnet build --no-restore --configuration Release RTSP.sln
            # Get a short-lived NuGet API key
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ngraziano
      - name: Publish
        run: dotnet nuget push RTSP/bin/Release/SharpRTSP*.nupkg -k ${{steps.login.outputs.NUGET_API_KEY}} -s https://api.nuget.org/v3/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_TOKEN }}
